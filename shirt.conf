# shirt.conf -- sourced by shirt.sh (bash). Paths may use $SHIRT_HOME (the sSHiT checkout).
# Shared settings, kept in git. Personal overrides go in shirt.local.conf (not in git, read at
# the end of this file); see shirt.local.conf.example.

# ---------------------------------------------------------------- global
# Production: ONE site and ONE state dir for everybody. The state holds the snapshots that the
# "changes since the last report" sections compare against, so it must belong to the same site.
# Production runs need write access to both; anyone else uses --test.
SHIRT_WWW_ROOT=/sphenix/WWW/dlis/shirt          # production output
SHIRT_WWW_URL=""                                # public URL of SHIRT_WWW_ROOT, used in notifications (empty -> path only)
SHIRT_STATE_ROOT=/sphenix/user/dlis/shirt/state # production snapshots / caches (NOT web-visible)
SHIRT_TEST_WWW=$SHIRT_HOME/test_www             # --test output
SHIRT_TEST_STATE=$SHIRT_HOME/test_state         # --test state
SHIRT_KEEP_REPORTS=200                          # archived reports kept per check (0 = keep all)

# command that sets up the sPHENIX env; only run if `root` is not already in PATH
SHIRT_SPHENIX_SETUP="source /opt/sphenix/core/bin/sphenix_setup.sh -n new"

# ---------------------------------------------------------------- notify
SHIRT_WEBHOOK_URL=""        # Mattermost or Slack incoming webhook; empty = notifications off
SHIRT_NOTIFY_ON=WARN        # minimum status that triggers a message: OK | INFO | WARN | FAIL
SHIRT_NOTIFY_USERNAME=shirt

# ---------------------------------------------------------------- cdb
CDB_TAGS_FILE=$SHIRT_HOME/config/global_tags.txt   # curated; "TAG [runlist [payloadlist]]" per line, '#' comments
                                                   # lists relative to config/ or absolute; "-" = default
                                                   # "TAG:GROUP" = a run group of TAG (e.g. newcdbtag:run3auau), see README
CDB_PAYLOADS_FILE=$SHIRT_HOME/config/payloads.txt  # default payload list (tags without their own); one per line
CDB_RUN_NAMES_FILE=$SHIRT_HOME/config/runs/run_names.txt    # "RUN name": names shown with those runs in tables and plots
CDB_DETECTORS_FILE=$SHIRT_HOME/config/payloads/detectors.txt  # payload type -> detector (tables and plots per detector,
                                                   # detectors limited to some run groups); empty = no split
CDB_FLOATING_TAG=newcdbtag      # moving tag: changes are reported, not failed
CDB_GOODRUN_LIST=$SHIRT_HOME/config/goodruns.txt   # default run list (tags without their own); first column = run number
CDB_RECENT_DAYS=14
CDB_COMPARE_PAIRS=()            # e.g. ("ProdA_2024:ProdA_2024_v2")
CDB_ROOT_CHECK=1                # open .root payloads with ROOT (0 = stat + md5 only)
CDB_PLOTS=1                     # draw the per-group plots with ROOT (checks/cdb/draw.sh; 0 = CSVs only)

# ---------------------------------------------------------------- dst
DST_DAQ_DSN=daq                 # ODBC DSN of the run DB
DST_FC_DSN=FileCatalog          # ODBC DSN of the FileCatalog
DST_RANGES_FILE=$SHIRT_HOME/config/runs/run_ranges.txt   # "GROUP FIRST LAST|+ [MIN_EVENTS] [MIN_MINUTES]"
DST_TYPES_FILE=$SHIRT_HOME/config/dst/dst_types.txt      # expected DSTs; config/dst/<group>.txt overrides per group
DST_RUNTYPE=physics             # good run: this run type,
DST_MIN_EVENTS=100000           #   at least this many events,
DST_MIN_MINUTES=5               #   at least this long,
# EMCal seb00-seb15, IHCal+OHCal seb16-seb17, MBD seb18, ZDC+sEPD seb20; a good run has all of them
DST_CALO_HOSTS="seb00 seb01 seb02 seb03 seb04 seb05 seb06 seb07 seb08 seb09 seb10 seb11 seb12 seb13 seb14 seb15 seb16 seb17 seb18 seb20"
DST_RUNDB_UNLOGGED="seb18"      # hosts never listed in the run DB (event_numbers): not part of the run-DB check,
                                # but still required as DST_TRIGGERED_EVENT_<host>
DST_MIN_EVENT_FRAC=0            # WARN if a DST has fewer than this fraction of the run's events (0 = off)
DST_GOODRUN_DIR=$SHIRT_HOME/config/runs   # <dir>/<group>.goodruns.txt: written by checks/dst/make_runlists.sh, read by the dst check
DST_PLOTS=1                     # draw the per-group plots with ROOT (checks/dst/draw.sh; 0 = CSVs only)

# ---------------------------------------------------------------- personal overrides (not in git)
if [ -f "$SHIRT_HOME/shirt.local.conf" ]; then . "$SHIRT_HOME/shirt.local.conf"; fi
